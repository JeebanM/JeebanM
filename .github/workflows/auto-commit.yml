name: Daily Auto Commit

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto commit script
        run: python auto_commit.py

      - name: Commit and push
        run: |
          git config --global user.name "Jeeban Mohanty"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "docs: daily dev log update [$(date +%F)]"
          git push
